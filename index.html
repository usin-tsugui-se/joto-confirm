<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>上棟予定確認 | usin</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@700;800&family=Public+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
:root{color-scheme:light;--paper:#F6F4EF;--surface:#FFFFFF;--ink:#24211C;--muted:#746F66;--border:#E3DFD4;
--amber:#E2A63B;--amber-ink:#5B3E0C;--amber-soft:#FBEBD1;--steel:#3F5A6B;--steel-ink:#FFFFFF;--steel-soft:#E7EEF1;
--good:#2F7D5D;--good-soft:#E4F1EA;--warn:#B23B2E;--warn-soft:#F8E6E2;
--shadow:0 1px 2px rgba(36,33,28,.06),0 8px 24px -12px rgba(36,33,28,.18);}
*{box-sizing:border-box;}
body{margin:0;background:var(--paper);color:var(--ink);
font-family:"Public Sans","Hiragino Sans","Yu Gothic",sans-serif;line-height:1.6;-webkit-font-smoothing:antialiased;}
.wrap{max-width:560px;margin:0 auto;padding:20px 18px 80px;}
.brand{display:flex;align-items:center;margin-bottom:18px;}
.brand svg{width:190px;height:auto;}
.eyebrow{display:inline-flex;align-items:center;gap:8px;font-family:"IBM Plex Mono",monospace;font-size:12px;
letter-spacing:.08em;text-transform:uppercase;color:var(--amber-ink);background:var(--amber-soft);
border:1px solid var(--amber);padding:5px 10px 5px 8px;border-radius:999px;margin-bottom:14px;}
.eyebrow .dot{width:6px;height:6px;border-radius:50%;background:var(--amber);}
h1{font-family:"Archivo",sans-serif;font-weight:800;font-size:clamp(22px,6vw,30px);line-height:1.25;margin:0 0 6px;}
.meta{color:var(--muted);font-size:14.5px;margin:0 0 22px;}
.card{background:var(--surface);border:1px solid var(--border);border-radius:16px;box-shadow:var(--shadow);padding:22px;margin-bottom:20px;}
.subcard{background:var(--paper);border:1px solid var(--border);border-radius:12px;padding:16px;margin-bottom:14px;}
.subcard:last-of-type{margin-bottom:16px;}
.weather{display:flex;align-items:center;gap:14px;padding:14px 16px;border-radius:14px;background:var(--steel-soft);
border:1px solid var(--steel);margin-bottom:14px;}
.weather .icon{font-size:26px;}.weather .pop{font-family:"IBM Plex Mono",monospace;font-weight:600;font-size:20px;color:var(--steel);}
.weather .label{font-size:12.5px;color:var(--muted);}.weather .desc{font-weight:600;font-size:14.5px;}
.q-label{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:6px 10px;font-weight:700;font-size:15.5px;margin-bottom:10px;}
.q-num{font-family:"IBM Plex Mono",monospace;font-size:12px;color:var(--muted);font-weight:600;}
.q-sub{color:var(--muted);font-size:13.5px;margin:-4px 0 12px;}
.site-date{font-family:"IBM Plex Mono",monospace;font-size:17px;font-weight:700;color:var(--ink);}
.site-address{color:var(--ink);font-weight:600;font-size:14.5px;margin:-2px 0 12px;}
.big-date{font-family:"IBM Plex Mono",monospace;font-size:22px;font-weight:600;background:var(--paper);
border:1px solid var(--border);border-radius:10px;padding:12px 14px;margin-bottom:14px;}
.toggle-row{display:flex;gap:10px;}.toggle{flex:1;border:1.5px solid var(--border);background:var(--surface);color:var(--ink);
padding:13px 10px;border-radius:10px;font-family:inherit;font-size:15px;font-weight:600;cursor:pointer;}
.toggle.yes.selected{border-color:var(--good);background:var(--good-soft);color:var(--good);}
.toggle.no.selected{border-color:var(--warn);background:var(--warn-soft);color:var(--warn);}
.reveal{max-height:0;overflow:hidden;transition:max-height .2s ease;}.reveal.open{max-height:200px;margin-top:12px;}
label.field-label{display:block;font-size:13px;font-weight:600;color:var(--muted);margin-bottom:6px;}
input,textarea,select{width:100%;font-family:inherit;font-size:15px;color:var(--ink);background:var(--paper);
border:1.5px solid var(--border);border-radius:10px;padding:11px 12px;}
textarea{resize:vertical;min-height:84px;}
select{appearance:auto;}
button.submit{width:100%;border:none;background:var(--steel);color:var(--steel-ink);font-family:inherit;font-weight:700;
font-size:16px;padding:15px;border-radius:12px;cursor:pointer;box-shadow:var(--shadow);}
button.submit:disabled{opacity:.45;cursor:not-allowed;}
.status-line{font-size:13.5px;color:var(--muted);margin-top:12px;min-height:18px;}
.status-line.err{color:var(--warn);}.status-line.ok{color:var(--good);}
.answered-badge{background:var(--good-soft);color:var(--good);border:1px solid var(--good);border-radius:10px;
padding:8px 12px;font-size:13px;font-weight:600;margin-bottom:16px;}
.phone-notice{background:var(--paper);border:1px solid var(--border);border-radius:10px;
padding:12px 14px;font-size:13px;color:var(--muted);margin:16px 0;}
.phone-notice strong{color:var(--ink);font-weight:700;}
.rokuyo{display:inline-block;font-size:12px;font-weight:700;padding:2px 9px;border-radius:999px;margin-left:8px;vertical-align:middle;white-space:nowrap;}
.rokuyo.good{background:var(--good-soft);color:var(--good);}
.rokuyo.warn{background:var(--warn-soft);color:var(--warn);}
.rokuyo.neutral{background:var(--steel-soft);color:var(--steel);}
.center-state{text-align:center;padding:60px 20px;color:var(--muted);}
.center-state h2{font-family:"Archivo",sans-serif;font-weight:800;color:var(--ink);font-size:22px;margin:14px 0 8px;}
.big-icon{font-size:44px;}
.wx-panel{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:14px 16px 10px;margin-bottom:12px;}
.wx-title{display:flex;align-items:baseline;justify-content:space-between;font-size:13px;font-weight:700;color:var(--ink);margin-bottom:2px;}
.wx-title .wx-figure{font-family:"IBM Plex Mono",monospace;font-weight:600;color:var(--steel);font-size:13px;}
.wx-sub{font-size:12px;color:var(--muted);margin-bottom:8px;}
.wx-svg{display:block;width:100%;height:auto;}
.wx-grid{stroke:var(--border);stroke-width:1;}
.wx-bar{fill:var(--steel-soft);}.wx-bar.peak{fill:var(--steel);}
.wx-line{fill:none;stroke:var(--steel);stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}
.wx-dot{fill:var(--surface);stroke:var(--steel);stroke-width:2;}.wx-dot.peak{fill:var(--steel);}
.wx-axis-label{font-family:"IBM Plex Mono",monospace;font-size:10.5px;fill:var(--muted);}
.wx-dir-label{font-size:10px;fill:var(--muted);}
.wx-value-label{font-family:"IBM Plex Mono",monospace;font-size:11px;font-weight:600;fill:var(--ink);}
.footer-note{text-align:center;color:var(--muted);font-size:12px;margin-top:24px;}
</style>
</head>
<body>
<div class="wrap" id="app">

<div class="brand">
  <svg viewBox="0 0 380 120" xmlns="http://www.w3.org/2000/svg">
    <defs><linearGradient id="craneGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff8a3d"/><stop offset="100%" stop-color="#ff6b1a"/>
    </linearGradient></defs>
    <g transform="translate(6,10)">
      <rect x="4" y="78" width="26" height="14" rx="2" fill="#1c3350"/>
      <rect x="20" y="16" width="8" height="76" fill="#1c3350"/>
      <path d="M24 22 L96 22 L96 30 L24 30 Z" fill="url(#craneGrad)"/>
      <path d="M24 22 L4 26 L4 32 L24 30 Z" fill="#1c3350"/>
      <rect x="18" y="30" width="16" height="10" rx="1.5" fill="#1c3350"/>
      <line x1="88" y1="30" x2="88" y2="58" stroke="#1c3350" stroke-width="2"/>
      <path d="M85 58 h6 v5 a3 3 0 0 1 -6 0 z" fill="#1c3350"/>
      <line x1="20" y1="22" x2="4" y2="27" stroke="#1c3350" stroke-width="2"/>
      <line x1="28" y1="22" x2="70" y2="26" stroke="#1c3350" stroke-width="1.5"/>
    </g>
    <g transform="translate(112,0)" font-family="'Archivo','Hiragino Sans','Yu Gothic',sans-serif">
      <text x="0" y="58" font-size="38" font-weight="800" fill="#1c3350" letter-spacing="0.5">usin</text>
      <text x="2" y="80" font-size="13" letter-spacing="2.5" fill="#ff6b1a" font-weight="600">CRANE SERVICE</text>
      <text x="2" y="100" font-size="13" fill="#5a6b7d">建て方・上棟 3日前確認</text>
    </g>
  </svg>
</div>

<div id="content">
  <div class="center-state"><div class="big-icon">⏳</div><h2>読み込み中…</h2></div>
</div>

</div>

<script>
// ==================== 設定 ====================
// GAS #3 Web AppのURL。Apps Scriptエディタで「新しいバージョンをデプロイ」した場合、
// 同じデプロイを更新していればURLは変わらない。別の新規デプロイを作った場合はここを更新すること。
var GAS_API_URL = 'https://script.google.com/macros/s/AKfycbwOcYRfCo1IdMvmPjl9aZ9nOBrr_kpatFo0SF-YZf9hyCELW9CSQSa4bn8yT-YL1f5G/exec';
var EQUIPMENT_OPTIONS_FALLBACK = ['10TR', '13TR', 'Pitgoras', '16TR', '22TR', '25TR', '50TR', '80TR'];

function escapeHtml(s) {
  return String(s == null ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}

// 「2026年9月12日(土)」「2026-09-12」のような表記から日付を緩く読み取る（GAS側parseDateLoose_と同じロジック）
var WEEKDAY_JA = ['日', '月', '火', '水', '木', '金', '土'];
function parseDateLoose(s) {
  if (!s) return null;
  var str = String(s);
  var m = str.match(/(\d{4})年(\d{1,2})月(\d{1,2})日/);
  if (!m) m = str.match(/(\d{4})-(\d{1,2})-(\d{1,2})/);
  if (!m) return null;
  var d = new Date(Number(m[1]), Number(m[2]) - 1, Number(m[3]));
  return isNaN(d.getTime()) ? null : d;
}
// 日付表記に曜日が付いていない場合だけ「（曜）」を補う（既に付いているデータは二重にしない）
function withWeekday(label) {
  if (!label) return label;
  if (/[（(][日月火水木金土][）)]/.test(label)) return label;
  var d = parseDateLoose(label);
  if (!d) return label;
  return label + '（' + WEEKDAY_JA[d.getDay()] + '）';
}

// ==================== SVGグラフ描画（GAS側のロジックをそのまま移植） ====================
function renderBarSeriesSvg(series, opts) {
  opts = opts || {};
  var n = series.length;
  var values = series.map(function (p) { return Number(p[1]) || 0; });
  var maxVal = Math.max.apply(null, values);
  var axisMax = opts.axisMax || Math.max(opts.minAxisMax || 1, Math.ceil(maxVal * 1.25));
  var plotLeft = 30, plotRight = 470, top = 14, base = 86;
  var plotWidth = plotRight - plotLeft;
  var slot = plotWidth / n;
  var barWidth = Math.min(60, slot * 0.55);
  var peakIdx = values.indexOf(maxVal);

  var grid = '';
  [0, 0.5, 1].forEach(function (frac) {
    var y = base - frac * (base - top);
    var val = Math.round(axisMax * frac);
    grid += '<line class="wx-grid" x1="' + plotLeft + '" y1="' + y + '" x2="' + plotRight + '" y2="' + y + '"></line>';
    grid += '<text class="wx-axis-label" x="0" y="' + (y + 4) + '">' + val + opts.unit + '</text>';
  });

  var bars = '', axisLabels = '';
  for (var i = 0; i < n; i++) {
    var cx = plotLeft + slot * (i + 0.5);
    var v = values[i];
    var h = axisMax > 0 ? (v / axisMax) * (base - top) : 0;
    var y = base - h;
    var isPeak = i === peakIdx && maxVal > 0;
    bars += '<rect class="wx-bar' + (isPeak ? ' peak' : '') + '" x="' + (cx - barWidth / 2) + '" y="' + y +
      '" width="' + barWidth + '" height="' + Math.max(h, 2) + '" rx="4"></rect>';
    if (isPeak) {
      bars += '<text class="wx-value-label" x="' + cx + '" y="' + (y - 6) + '" text-anchor="middle">' + v + opts.unit + '</text>';
    }
    axisLabels += '<text class="wx-axis-label" x="' + cx + '" y="100" text-anchor="middle">' + escapeHtml(series[i][0]) + '</text>';
  }
  return '<svg class="wx-svg" viewBox="0 0 480 120" preserveAspectRatio="xMinYMid meet">' + grid + bars + axisLabels + '</svg>';
}

function renderWindSeriesSvg(series) {
  var n = series.length;
  var values = series.map(function (p) { return Number(p[1]) || 0; });
  var maxVal = Math.max.apply(null, values);
  var axisMax = Math.max(2, Math.ceil((maxVal * 1.3) / 2) * 2);
  var plotLeft = 30, plotRight = 470, top = 14, base = 82;
  var plotWidth = plotRight - plotLeft;
  var slot = n > 1 ? plotWidth / (n - 1) : 0;
  var peakIdx = values.indexOf(maxVal);

  var grid = '';
  [0, 0.5, 1].forEach(function (frac) {
    var y = base - frac * (base - top);
    var val = Math.round(axisMax * frac);
    grid += '<line class="wx-grid" x1="' + plotLeft + '" y1="' + y + '" x2="' + plotRight + '" y2="' + y + '"></line>';
    grid += '<text class="wx-axis-label" x="0" y="' + (y + 4) + '">' + val + '</text>';
  });

  var pts = [], dots = '', axisLabels = '', dirLabels = '';
  for (var i = 0; i < n; i++) {
    var cx = n > 1 ? plotLeft + slot * i : (plotLeft + plotRight) / 2;
    var v = values[i];
    var y = axisMax > 0 ? base - (v / axisMax) * (base - top) : base;
    pts.push(cx + ',' + y);
    var isPeak = i === peakIdx && maxVal > 0;
    dots += '<circle class="wx-dot' + (isPeak ? ' peak' : '') + '" cx="' + cx + '" cy="' + y + '" r="' + (isPeak ? 5 : 4) + '"></circle>';
    if (isPeak) {
      dots += '<text class="wx-value-label" x="' + cx + '" y="' + (y - 12) + '" text-anchor="middle">' + v + 'm/s</text>';
    }
    axisLabels += '<text class="wx-axis-label" x="' + cx + '" y="100" text-anchor="middle">' + escapeHtml(series[i][0]) + '</text>';
    if (series[i][2]) {
      dirLabels += '<text class="wx-dir-label" x="' + cx + '" y="114" text-anchor="middle">' + escapeHtml(series[i][2]) + '</text>';
    }
  }
  return '<svg class="wx-svg" viewBox="0 0 480 120" preserveAspectRatio="xMinYMid meet">' + grid +
    '<polyline class="wx-line" points="' + pts.join(' ') + '"></polyline>' + dots + axisLabels + dirLabels + '</svg>';
}

// ==================== カードHTML描画 ====================
function toggleBtnHtml(id, q, v, label, selectedVal) {
  var isSel = selectedVal === v;
  return '<button type="button" class="toggle ' + (v ? 'yes' : 'no') + (isSel ? ' selected' : '') +
    '" data-id="' + id + '" data-q="' + q + '" data-v="' + v + '">' + label + '</button>';
}

function renderFormCard(item, equipmentOptions) {
  var safeId = escapeHtml(item.id);
  if (!item.found) {
    return '<div class="card"><p class="q-sub">⚠ 現場ID「' + safeId + '」の確認内容が見つかりませんでした。</p></div>';
  }
  var resp = item.response;
  var sel = { onSchedule: null, equipmentOk: null, timeOk: null };
  var pre = { revisedDate: '', revisedEquipment: '', revisedTime: '', notes: '' };
  if (resp) {
    sel.onSchedule = resp.onSchedule;
    sel.equipmentOk = resp.equipmentOk;
    sel.timeOk = resp.timeOk;
    pre.revisedDate = resp.revisedDate;
    pre.revisedEquipment = resp.revisedEquipment;
    pre.revisedTime = resp.revisedTime;
    pre.notes = resp.notes;
  }

  var rokuyoBadge = item.rokuyo ? ' <span class="rokuyo ' + item.rokuyo.cls + '">' + escapeHtml(item.rokuyo.name) + '</span>' : '';
  // 「邸名」列に既に「様邸」が含まれているデータとそうでないデータが混在しているため、
  // 末尾が「様邸」で終わっていない場合だけ補う（二重表示「様邸様邸」を防ぐ）
  // 「邸名」列には個人客(様邸/邸/様)・会社名・建物名などが混在しており、接尾語を機械的に付けると
  // かえって誤表示になるため、データの値をそのまま表示する（付け足さない）
  var displayName = item.name;

  var html = '<div class="card" data-card-id="' + safeId + '">';
  html += '<div class="q-label"><span>' + escapeHtml(displayName) + '</span><span class="site-date">' + escapeHtml(withWeekday(item.scheduledDateLabel)) + rokuyoBadge + '</span></div>';
  // 担当者名も「邸名」と同じく、データ側に既に「様」が含まれている場合とそうでない場合が混在しているため、
  // 末尾が「様」で終わっていない場合だけ補う（「様様」の二重表示を防ぐ）
  var personDisplay = item.personInCharge ? (/様$/.test(item.personInCharge) ? item.personInCharge : (item.personInCharge + '様')) : '';
  if (item.address) html += '<p class="site-address">' + escapeHtml(item.address) + (personDisplay ? ' ・ 担当（' + escapeHtml(personDisplay) + '）' : '') + '</p>';
  if (resp) {
    html += '<div class="answered-badge">✅ 回答済み（' + escapeHtml(resp.respondedAt) + '）・内容はいつでも修正して再送信できます</div>';
  }

  if (item.weather) {
    var pop = item.weather.pop;
    html += '<div class="weather"><div class="icon">' + (pop != null && pop >= 50 ? '☔' : '⛅') + '</div>' +
      '<div style="flex:1;"><div class="label">上棟予定日の天気予報</div><div class="desc">' + escapeHtml(item.weather.summary) + '</div></div>' +
      '<div class="pop">' + (pop != null ? pop + '%' : '—') + '</div></div>';
  }

  if (item.series.pop && item.series.pop.length) {
    var popValues = item.series.pop.map(function (p) { return Number(p[1]) || 0; });
    var popPeak = popValues.indexOf(Math.max.apply(null, popValues));
    html += '<div class="wx-panel"><div class="wx-title"><span>降水確率</span><span class="wx-figure">最大 ' +
      popValues[popPeak] + '%（' + escapeHtml(item.series.pop[popPeak][0]) + '）</span></div>' +
      '<div class="wx-sub">6時間ごとの降水確率</div>' + renderBarSeriesSvg(item.series.pop, { unit: '%', axisMax: 100 }) + '</div>';
  }
  if (item.series.rain && item.series.rain.length) {
    var rainValues = item.series.rain.map(function (p) { return Number(p[1]) || 0; });
    var rainPeak = rainValues.indexOf(Math.max.apply(null, rainValues));
    html += '<div class="wx-panel"><div class="wx-title"><span>降水量</span><span class="wx-figure">最大 ' +
      rainValues[rainPeak] + 'mm（' + escapeHtml(item.series.rain[rainPeak][0]) + '）</span></div>' +
      '<div class="wx-sub">6時間ごとの降水量(mm)</div>' + renderBarSeriesSvg(item.series.rain, { unit: 'mm', minAxisMax: 2 }) + '</div>';
  }
  if (item.series.wind && item.series.wind.length) {
    var windValues = item.series.wind.map(function (p) { return Number(p[1]) || 0; });
    var windPeak = windValues.indexOf(Math.max.apply(null, windValues));
    html += '<div class="wx-panel"><div class="wx-title"><span>風の強さ</span><span class="wx-figure">最大 ' +
      windValues[windPeak] + 'm/s（' + escapeHtml(item.series.wind[windPeak][0]) + '）</span></div>' +
      '<div class="wx-sub">6時間ごとの風速・風向</div>' + renderWindSeriesSvg(item.series.wind) + '</div>';
  }

  html += '<div class="subcard"><div class="q-label"><span>予定日は変更ありませんか？</span><span class="q-num">Q1</span></div>' +
    '<div class="big-date">' + escapeHtml(withWeekday(item.scheduledDateLabel)) + rokuyoBadge + '</div>' +
    '<div class="toggle-row">' + toggleBtnHtml(safeId, 'onSchedule', true, '予定通りです', sel.onSchedule) + toggleBtnHtml(safeId, 'onSchedule', false, '変更があります', sel.onSchedule) + '</div>' +
    '<div class="reveal' + (sel.onSchedule === false ? ' open' : '') + '" data-reveal-for="' + safeId + '__onSchedule"><label class="field-label">正しい上棟予定日</label>' +
    '<input type="date" data-id="' + safeId + '" data-field="revisedDate" value="' + escapeHtml(pre.revisedDate) + '"></div></div>';

  var opts = (equipmentOptions && equipmentOptions.length) ? equipmentOptions : EQUIPMENT_OPTIONS_FALLBACK;
  var equipmentSelectHtml = '<select data-id="' + safeId + '" data-field="revisedEquipment"><option value="">選択してください</option>' +
    opts.map(function (opt) {
      return '<option value="' + escapeHtml(opt) + '"' + (pre.revisedEquipment === opt ? ' selected' : '') + '>' + escapeHtml(opt) + '</option>';
    }).join('') + '</select>';

  html += '<div class="subcard"><div class="q-label"><span>機種はこちらでよろしいですか？</span><span class="q-num">Q2</span></div>' +
    '<div class="big-date">' + escapeHtml(item.equipment) + '</div>' +
    '<div class="toggle-row">' + toggleBtnHtml(safeId, 'equipmentOk', true, 'この機種でOKです', sel.equipmentOk) + toggleBtnHtml(safeId, 'equipmentOk', false, '変更希望', sel.equipmentOk) + '</div>' +
    '<div class="reveal' + (sel.equipmentOk === false ? ' open' : '') + '" data-reveal-for="' + safeId + '__equipmentOk"><label class="field-label">希望の機種</label>' +
    equipmentSelectHtml + '</div></div>';

  html += '<div class="subcard"><div class="q-label"><span>着時間はこの時間でよろしいですか？</span><span class="q-num">Q3</span></div>' +
    '<div class="big-date">' + escapeHtml(item.arrivalTime) + '</div>' +
    '<div class="toggle-row">' + toggleBtnHtml(safeId, 'timeOk', true, 'この時間でOKです', sel.timeOk) + toggleBtnHtml(safeId, 'timeOk', false, '変更希望', sel.timeOk) + '</div>' +
    '<div class="reveal' + (sel.timeOk === false ? ' open' : '') + '" data-reveal-for="' + safeId + '__timeOk"><label class="field-label">希望の着時間</label>' +
    '<input type="time" data-id="' + safeId + '" data-field="revisedTime" value="' + escapeHtml(pre.revisedTime) + '"></div></div>';

  html += '<div class="subcard"><div class="q-label"><span>現場搬入等の注意事項</span><span class="q-num">Q4</span></div>' +
    '<p class="q-sub">駐車スペース、道幅制限、近隣配慮など、あれば入力してください（任意）</p>' +
    '<textarea data-id="' + safeId + '" data-field="notes" placeholder="例：現場前は駐車不可のため、南側の月極駐車場をご利用ください">' + escapeHtml(pre.notes) + '</textarea></div>';

  html += '<div class="phone-notice">こちらでの予定変更の受付は<strong>本日中のみ</strong>です。期限を過ぎた場合や急ぎのご連絡は、お電話にてお願いいたします。<br>' +
    '<strong>' + escapeHtml(window.__CONTACT_PHONE__ || '0561-34-5138') + '</strong>（受付 9:00〜15:00）</div>';

  var allAnswered = sel.onSchedule !== null && sel.equipmentOk !== null && sel.timeOk !== null;
  html += '<button type="button" class="submit" data-id="' + safeId + '"' + (allAnswered ? '' : ' disabled') + '>' +
    (resp ? 'この現場の回答を修正して送信' : 'この現場の回答を送信') + '</button>' +
    '<div class="status-line" data-status-for="' + safeId + '"></div>';
  html += '</div>';
  return html;
}

// ==================== ページ動作ロジック ====================
var state = {};
function stateFor(id) { if (!state[id]) state[id] = { onSchedule: null, equipmentOk: null, timeOk: null }; return state[id]; }

function updateEnabled(id) {
  var s = stateFor(id);
  var ready = s.onSchedule !== null && s.equipmentOk !== null && s.timeOk !== null;
  if (s.onSchedule === false) { var f = document.querySelector('[data-id="' + id + '"][data-field="revisedDate"]'); ready = ready && !!(f && f.value); }
  if (s.equipmentOk === false) { var f2 = document.querySelector('[data-id="' + id + '"][data-field="revisedEquipment"]'); ready = ready && !!(f2 && f2.value); }
  if (s.timeOk === false) { var f3 = document.querySelector('[data-id="' + id + '"][data-field="revisedTime"]'); ready = ready && !!(f3 && f3.value); }
  var btn = document.querySelector('button.submit[data-id="' + id + '"]');
  if (btn) btn.disabled = !ready;
}

function wireUpEvents() {
  document.querySelectorAll('.toggle.selected').forEach(function (btn) {
    stateFor(btn.dataset.id)[btn.dataset.q] = btn.dataset.v === 'true';
  });
  document.querySelectorAll('.card[data-card-id]').forEach(function (card) { updateEnabled(card.dataset.cardId); });

  document.querySelectorAll('.toggle').forEach(function (btn) {
    btn.addEventListener('click', function () {
      var id = btn.dataset.id, q = btn.dataset.q, v = btn.dataset.v === 'true';
      stateFor(id)[q] = v;
      document.querySelectorAll('.toggle[data-id="' + id + '"][data-q="' + q + '"]').forEach(function (b) { b.classList.toggle('selected', b === btn); });
      var reveal = document.querySelector('[data-reveal-for="' + id + '__' + q + '"]');
      if (reveal) reveal.classList.toggle('open', v === false);
      updateEnabled(id);
    });
  });

  document.querySelectorAll('input[data-field],textarea[data-field]').forEach(function (inp) {
    inp.addEventListener('input', function () { updateEnabled(inp.dataset.id); });
  });

  document.querySelectorAll('button.submit').forEach(function (btn) {
    btn.addEventListener('click', function () {
      var id = btn.dataset.id, s = stateFor(id);
      btn.disabled = true;
      var statusEl = document.querySelector('[data-status-for="' + id + '"]');
      statusEl.className = 'status-line'; statusEl.textContent = '送信しています…';
      function val(field) { var el = document.querySelector('[data-id="' + id + '"][data-field="' + field + '"]'); return el ? el.value : ''; }
      var payload = {
        onSchedule: s.onSchedule,
        revisedDate: s.onSchedule === false ? val('revisedDate') : '',
        equipmentOk: s.equipmentOk,
        revisedEquipment: s.equipmentOk === false ? val('revisedEquipment') : '',
        timeOk: s.timeOk,
        revisedTime: s.timeOk === false ? val('revisedTime') : '',
        notes: val('notes')
      };
      fetch(GAS_API_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' }, // プリフライト回避のためtext/plainで送る（GAS側でJSON.parseする）
        body: JSON.stringify({ action: 'submitResponse', id: id, payload: payload })
      })
        .then(function (r) { return r.json(); })
        .then(function (res) {
          if (res && res.ok) {
            statusEl.className = 'status-line ok';
            statusEl.textContent = (res.wasUpdate ? '回答を修正しました。' : '送信しました。') + 'ありがとうございました。';
            setTimeout(function () { location.reload(); }, 900);
          } else {
            statusEl.className = 'status-line err';
            statusEl.textContent = '送信できませんでした。時間をおいてもう一度お試しください。';
            btn.disabled = false;
          }
        })
        .catch(function () {
          statusEl.className = 'status-line err';
          statusEl.textContent = '送信に失敗しました。もう一度お試しください。';
          btn.disabled = false;
        });
    });
  });
}

function renderInvalid() {
  document.getElementById('content').innerHTML =
    '<div class="center-state"><div class="big-icon">⚠️</div><h2>リンクを確認してください</h2>' +
    '<p>この確認フォームのリンクが正しくないか、期限が切れている可能性があります。<br>お手数ですが、通知元のメッセージからもう一度お試しください。</p></div>';
}

function renderError() {
  document.getElementById('content').innerHTML =
    '<div class="center-state"><div class="big-icon">📡</div><h2>読み込みに失敗しました</h2>' +
    '<p>通信状況をご確認の上、ページを再読み込みしてください。</p></div>';
}

function boot() {
  var params = new URLSearchParams(location.search);
  var idsParam = (params.get('id') || '').trim();
  if (!idsParam) { renderInvalid(); return; }

  fetch(GAS_API_URL + '?format=json&id=' + encodeURIComponent(idsParam))
    .then(function (r) { return r.json(); })
    .then(function (data) {
      if (!data || !data.ok) { renderError(); return; }
      window.__CONTACT_PHONE__ = data.contactPhone;
      var validCount = data.items.filter(function (it) { return it.found; }).length;
      var header = '<span class="eyebrow"><span class="dot"></span>上棟予定確認</span>';
      if (validCount > 1) {
        header += '<h1>本日確認いただきたい現場（' + validCount + '件）</h1><p class="meta">現場ごとに個別にご回答いただけます。一部だけ回答して後で残りに戻ることもできます。</p>';
      }
      if (validCount === 1) {
        var only = data.items.filter(function (it) { return it.found; })[0];
        document.title = only.name + ' 上棟確認 | usin';
      }
      var cardsHtml = data.items.map(function (item) { return renderFormCard(item, data.equipmentOptions); }).join('');
      document.getElementById('content').innerHTML = header + cardsHtml +
        '<p class="footer-note">usin クレーン作業 上棟予定確認システム</p>';
      wireUpEvents();
    })
    .catch(function () { renderError(); });
}

boot();
</script>

</html>
